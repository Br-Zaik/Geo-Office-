name: Compilar Geo Office

on:
  push:
    branches:
      - main
    paths:
      - "proyectos/*.zip"
      - "proyectos/**/*.zip"
      - ".github/workflows/compilar-geo-office.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-office-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Crear APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Buscar ZIP más reciente
        id: preparar
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "proyectos" ]; then
            echo "::error::No existe la carpeta proyectos."
            exit 1
          fi

          zip_elegido=""
          fecha_elegida=0

          while IFS= read -r -d '' archivo; do
            fecha="$(
              git log -1 --format=%ct -- "$archivo" 2>/dev/null || echo 0
            )"

            fecha="${fecha:-0}"

            if [ "$fecha" -ge "$fecha_elegida" ]; then
              fecha_elegida="$fecha"
              zip_elegido="$archivo"
            fi
          done < <(
            find proyectos \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ -z "$zip_elegido" ]; then
            echo "::error::No hay ningún ZIP dentro de la carpeta proyectos."
            exit 1
          fi

          echo "ZIP seleccionado: $zip_elegido"

          carpeta_extraida="$RUNNER_TEMP/geo-office-extraido"

          rm -rf "$carpeta_extraida"
          mkdir -p "$carpeta_extraida"

          ZIP_ARCHIVO="$zip_elegido" \
          CARPETA_DESTINO="$carpeta_extraida" \
          python3 <<'PYTHON'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archivo_zip = Path(os.environ["ZIP_ARCHIVO"])
          destino = Path(os.environ["CARPETA_DESTINO"]).resolve()

          try:
              zip_abierto = zipfile.ZipFile(archivo_zip)
          except zipfile.BadZipFile:
              raise SystemExit(
                  f"ERROR: El archivo no es un ZIP válido: {archivo_zip}"
              )

          with zip_abierto:
              for elemento in zip_abierto.infolist():
                  ruta_final = (destino / elemento.filename).resolve()

                  try:
                      ruta_final.relative_to(destino)
                  except ValueError:
                      raise SystemExit(
                          "ERROR: El ZIP contiene una ruta insegura: "
                          + elemento.filename
                      )

                  if elemento.is_dir():
                      ruta_final.mkdir(
                          parents=True,
                          exist_ok=True
                      )
                      continue

                  ruta_final.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with zip_abierto.open(elemento) as origen:
                      with open(ruta_final, "wb") as salida:
                          shutil.copyfileobj(origen, salida)
          PYTHON

          gradlew_elegido=""

          while IFS= read -r -d '' archivo_gradlew; do
            if [ -z "$gradlew_elegido" ]; then
              gradlew_elegido="$archivo_gradlew"
            elif [ "${#archivo_gradlew}" -lt "${#gradlew_elegido}" ]; then
              gradlew_elegido="$archivo_gradlew"
            fi
          done < <(
            find "$carpeta_extraida" \
              -type f \
              -name "gradlew" \
              -print0
          )

          if [ -z "$gradlew_elegido" ]; then
            echo "::error::El ZIP no contiene el archivo gradlew."
            echo "::error::Debes subir el proyecto Android Studio completo."
            exit 1
          fi

          carpeta_proyecto="$(dirname "$gradlew_elegido")"

          if [ ! -f "$carpeta_proyecto/settings.gradle" ] && \
             [ ! -f "$carpeta_proyecto/settings.gradle.kts" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            exit 1
          fi

          nombre_zip="$(basename "$zip_elegido")"
          nombre_zip="${nombre_zip%.*}"

          nombre_limpio="$(
            printf '%s' "$nombre_zip" |
            tr -cs 'A-Za-z0-9._-' '_' |
            sed 's/^_*//;s/_*$//'
          )"

          if [ -z "$nombre_limpio" ]; then
            nombre_limpio="Geo-Office"
          fi

          echo "project_dir=$carpeta_proyecto" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${nombre_limpio}-APK" >> "$GITHUB_OUTPUT"

          echo "Proyecto encontrado en:"
          echo "$carpeta_proyecto"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar Gradle
        shell: bash
        working-directory: ${{ steps.preparar.outputs.project_dir }}
        run: |
          set -euo pipefail

          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          ./gradlew --version

      - name: Compilar Geo Office
        shell: bash
        working-directory: ${{ steps.preparar.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Buscar APK generado
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.preparar.outputs.project_dir }}
        run: |
          set -euo pipefail

          carpeta_apks="$RUNNER_TEMP/apks-geo-office"

          rm -rf "$carpeta_apks"
          mkdir -p "$carpeta_apks"

          cantidad=0

          while IFS= read -r -d '' archivo_apk; do
            cantidad=$((cantidad + 1))

            nombre_apk="$(basename "$archivo_apk")"

            cp \
              "$archivo_apk" \
              "$carpeta_apks/${cantidad}-${nombre_apk}"

            echo "APK encontrado:"
            echo "$archivo_apk"
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              ! -path "*/androidTest/*" \
              -print0
          )

          if [ "$cantidad" -eq 0 ]; then
            echo "::error::No se encontró ningún APK generado."
            exit 1
          fi

          echo "apk_dir=$carpeta_apks" >> "$GITHUB_OUTPUT"

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preparar.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
